<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>NEPTUNKOD Hallgatók</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h2 { margin-top: 40px; }
    .box {
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        width: 450px;
    }
    label { display: block; margin-top: 10px; }
    input, select {
        width: 95%;
        padding: 6px;
        margin-top: 5px;
    }
    button {
        margin-top: 15px;
        padding: 8px 16px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        color: white;
        font-weight: bold;
    }
    .btn-save { background: green; }
    .btn-save2 { background: rgb(0, 96, 128); }
    .btn-edit { background: #17a2b8; }
    .btn-del { background: #dc3545; }
    table {
        width: 90%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    table, td, th {
        border: 1px solid #aaa;
        padding: 8px;
        text-align: left;
    }
    th { background: #eee; }
</style>
</head>
<body>

<h1>SEGUV3 Hallgatók</h1>

<div class="box">
    <h3>Új hallgató hozzáadása</h3>

    <label>Név:</label>
    <input id="nev">

    <label>Évfolyam:</label>
    <input id="evf" type="number">

    <label>Szak:</label>
    <input id="szak">

    <label>Email:</label>
    <input id="email">

    <label>NEPTUN kód:</label>
    <input id="neptun">

    <button class="btn-save" onclick="saveStudent()">Mentés</button>
</div>

<div class="box" style="width: 600px;">
    <h3>Keresés:</h3>
    <input id="keres" onkeyup="renderTable()">

    <h3>Rendezés:</h3>
    <select id="rendez" onchange="renderTable()">
        <option value="">Nincs rendezés</option>
        <option value="nev">Név</option>
        <option value="evf">Évfolyam</option>
    </select>

    <h3>Export / Import JSON</h3>
    <button class="btn-save2" onclick="exportJSON()">Export JSON</button>
    <br><br>
    <input type="file" id="importfile">
    <button class="btn-save2" onclick="importJSON()">Import JSON</button>

</div>

<h2>Hallgatók listája</h2>

<table id="tabla">
    <thead>
        <tr>
            <th>Név</th>
            <th>Évfolyam</th>
            <th>Szak</th>
            <th>Email</th>
            <th>NEPTUN</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
// ========================
//  LOCALSTORAGE KEZELÉS
// ========================

function getStudents() {
    return JSON.parse(localStorage.getItem("hallgatok") || "[]");
}

function saveStudents(list) {
    localStorage.setItem("hallgatok", JSON.stringify(list));
}

// ========================
//  HALLGATÓ MENTÉSE
// ========================

function saveStudent() {
    let h = {
        nev: document.getElementById("nev").value,
        evf: document.getElementById("evf").value,
        szak: document.getElementById("szak").value,
        email: document.getElementById("email").value,
        neptun: document.getElementById("neptun").value
    };

    if (!h.nev || !h.evf || !h.szak || !h.email || !h.neptun) {
        alert("Minden mezőt ki kell tölteni!");
        return;
    }

    let list = getStudents();
    list.push(h);
    saveStudents(list);

    clearForm();
    renderTable();
}

function clearForm() {
    document.getElementById("nev").value = "";
    document.getElementById("evf").value = "";
    document.getElementById("szak").value = "";
    document.getElementById("email").value = "";
    document.getElementById("neptun").value = "";
}

// ========================
//   HALLGATÓ TÖRLÉSE
// ========================

function deleteStudent(idx) {
    let list = getStudents();
    list.splice(idx, 1); 
    saveStudents(list);
    renderTable();
}

// ========================
//   HALLGATÓ MÓDOSÍTÁSA
// ========================

function editStudent(idx) {
    let list = getStudents();
    let h = list[idx];

    document.getElementById("nev").value = h.nev;
    document.getElementById("evf").value = h.evf;
    document.getElementById("szak").value = h.szak;
    document.getElementById("email").value = h.email;
    document.getElementById("neptun").value = h.neptun;

    deleteStudent(idx);
}

// ========================
//   TÁBLÁZAT MEGJELENÍTÉS
// ========================

function renderTable() {
    let list = getStudents();
    let keres = document.getElementById("keres").value.toLowerCase();
    let rend = document.getElementById("rendez").value;

    // Keresés
    if (keres) {
        list = list.filter(h =>
            h.nev.toLowerCase().includes(keres) ||
            h.evf.toString().includes(keres) ||
            h.szak.toLowerCase().includes(keres) ||
            h.email.toLowerCase().includes(keres) ||
            h.neptun.toLowerCase().includes(keres)
        );
    }

    // Rendezés
    if (rend === "nev") list.sort((a, b) => a.nev.localeCompare(b.nev));
    if (rend === "evf") list.sort((a, b) => a.evf - b.evf);

    let tbody = document.querySelector("#tabla tbody");
    tbody.innerHTML = "";

    list.forEach((h, idx) => {
        tbody.innerHTML += `
        <tr>
            <td>${h.nev}</td>
            <td>${h.evf}</td>
            <td>${h.szak}</td>
            <td>${h.email}</td>
            <td>${h.neptun}</td>
            <td>
                <button class="btn-edit" onclick="editStudent(${idx})">Módosít</button>
                <button class="btn-del" onclick="deleteStudent(${idx})">Töröl</button>
            </td>
        </tr>`;
    });
}

// ========================
//   JSON EXPORT / IMPORT
// ========================

function exportJSON() {
    let data = JSON.stringify(getStudents(), null, 2);
    let blob = new Blob([data], { type: "application/json" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "hallgatok.json";
    a.click();
}

function importJSON() {
    let file = document.getElementById("importfile").files[0];
    if (!file) {
        alert("Nincs kiválasztott fájl!");
        return;
    }

    let reader = new FileReader();
    reader.onload = function(e) {
        let data = JSON.parse(e.target.result);
        saveStudents(data);
        renderTable();
        alert("Import kész!");
    };
    reader.readAsText(file);
}

renderTable();
</script>

</body>
</html>
